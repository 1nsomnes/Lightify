<!DOCTYPE html>
<html>

<head>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>

  <script>

    const postToFlutter = (func, body) => {
      FlutterHost.postMessage(JSON.stringify(body === undefined ? {func} : {func, body}));
    }

    const installMediaHandlers = () => {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => togglePlayback());
        navigator.mediaSession.setActionHandler('pause', () => togglePlayback());
        navigator.mediaSession.setActionHandler('previoustrack', () => previous());
        navigator.mediaSession.setActionHandler('nexttrack', () => next());
      }
    }

    function registerListeners(player) {
      player.addListener('ready', ({device_id}) => {
        console.log("ready with id " + device_id)
        window.spotifyPlayer = player;
        postToFlutter("setDeviceId", {"device_id": device_id});

        installMediaHandlers();
      });

      player.addListener('not_ready', ({device_id}) => {
        console.log('Device ID has gone offline', device_id);
      });
      player.addListener('initialization_error', ({message}) => {
        console.error(message);
      });

      player.addListener('authentication_error', ({message}) => {
        console.log("Authentication Failed: " + message);
        postToFlutter("authenticationFailed");
      });

      player.addListener('account_error', ({message}) => {
        console.error("Account error: " + message);
      });

      player.addListener('player_state_changed', state => {
        if (!state) {
          console.log("no state")
          return;
        }

        installMediaHandlers();

        //TODO: possibly remove this update
        const current_track = state.track_window.current_track;
        current_track["position_ms"] = state.position;
        postToFlutter("updateData", current_track);
        postToFlutter("updateDataFromPlayer", state);
      });
    }


    window.onSpotifyWebPlaybackSDKReady = () => {
      window.token = '{token}';

      const player = new Spotify.Player({
        name: '{name}',
        getOAuthToken: cb => {cb(window.token);},
        volume: 1
      });
      console.log("spotify play back ready")

      registerListeners(player);
      player.connect();
    }

    function togglePlayback() {
      console.log("Toggling Play")
      window.spotifyPlayer.togglePlay();
    }

    function restartOrSkip(shouldRestart, skip) {
      const player = window.spotifyPlayer;
      player.getCurrentState().then(state => {
        if (!state) console.log("no state")

        if (state && shouldRestart(state)) {
          player.seek(0)
        } else {
          skip(player);
        }
      })
    }

    function next() {
      console.log("Skipping song")
      restartOrSkip(state => state.repeat_mode == 2, player => player.nextTrack());
    }

    function previous() {
      restartOrSkip(
        state => state.position >= 2000 || state.repeat_mode == 2,
        player => player.previousTrack()
      );
    }

    function seek(ms) {
      window.spotifyPlayer.seek(ms);
    }

    function reconnect() {
      console.log("Reconnect");
      window.spotifyPlayer.connect();
    }

    function setToken(token) {
      console.log("Token updated");
      window.token = token;
    }

  </script>
</head>


</html>
